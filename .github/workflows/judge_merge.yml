name: 매일 판단 반영

# Claude Code 예약 작업(tools/daily_judge.md)이 claude/judge-* 브랜치로 올린 판단을 main으로 옮긴다
#   옮기는 파일은 세 가지뿐: top20/picks.json, top20/top20.json, top20/log/*.md — 다른 파일이 섞여 있으면 멈춘다
#   (예약 작업은 claude/ 브랜치에만 올릴 수 있고, main에는 자동 갱신 봇의 커밋이 섞여 있어 직접 올리지 못한다)
on:
  push:
    branches: ['claude/judge-*']

permissions:
  contents: write

concurrency:
  group: judge-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 바뀐 파일 점검과 판단 파일 검사
        run: |
          git fetch -q origin main
          CHANGED=$(git diff --name-only origin/main...HEAD)
          echo "$CHANGED"
          BAD=$(echo "$CHANGED" | grep -v -E '^(top20/picks\.json|top20/top20\.json|top20/log/[0-9-]+\.md)$' || true)
          if [ -n "$BAD" ]; then echo "★ 옮길 수 없는 파일: $BAD"; exit 1; fi
          python3 - <<'PY'
          import json
          d = json.load(open('top20/picks.json', encoding='utf-8'))
          for m in ('kr', 'us'):
              for t in ('stable', 'aggressive'):
                  L = d[m][t]
                  assert len(L) == 20, (m, t, len(L))
                  for x in L:
                      assert x['code'] and 0 < x['p'] < 100 and x['target'] > 0 and x['stop'] > 0 and len(x['why']) == 3 and x['risk'], x
          assert d['meta'].get('judged')
          R = d['meta'].get('recos') or []
          assert isinstance(R, list) and len(R) <= 6, '추천 종목은 최대 6개'
          for x in R:
              assert x['mk'] in ('kr', 'us') and x['action'] in ('지금 매수', '분할 매수 시작', '기다림') and 0 < float(x['weight']) <= 10 and x['target'] > 0 and x['stop'] > 0, x
          A = d['meta'].get('alloc')
          if A:
              keys = ('kr', 'us', 'bond', 'gold', 'btc', 'cash')
              tot = sum(float(A.get(k) or 0) for k in keys)
              assert all(0 <= float(A.get(k) or 0) <= 100 for k in keys) and abs(tot - 100) <= 1, ('전체 비중 합계', tot)
              assert sum(float(x['weight']) for x in R if x['mk'] == 'kr') <= float(A.get('kr') or 0) + 0.01, '국장 추천 합계가 국장 주식 비중보다 큼'
              assert sum(float(x['weight']) for x in R if x['mk'] == 'us') <= float(A.get('us') or 0) + 0.01, '미장 추천 합계가 미장 주식 비중보다 큼'
          print('판단 파일 정상 · 추천 %d개 · 전체 비중 %s' % (len(R), '있음' if A else '없음'))
          PY
      - name: main으로 옮기기
        run: |
          BR="${GITHUB_REF_NAME}"
          git config user.name 'kfilter-bot'
          git config user.email 'kfilter-bot@users.noreply.github.com'
          FILES=$(git diff --name-only origin/main...HEAD)
          git checkout -q -B main origin/main
          git checkout "origin/$BR" -- $FILES
          git add $FILES
          if git diff --cached --quiet; then echo '바뀐 것 없음'; exit 0; fi
          git commit -q -m "$(git log -1 --format=%s "origin/$BR") — $BR에서 옮김"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
          git push -q origin --delete "$BR" || true
