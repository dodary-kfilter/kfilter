name: KRX 접속 테스트

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: pykrx 설치
        run: pip install pykrx pandas requests

      - name: KRX 접속 확인
        run: |
          python -c "
          from pykrx import stock
          print('=== 시세 테스트 ===')
          df = stock.get_market_ohlcv_by_date('20260601','20260605','005930')
          print('시세 rows:', 0 if df is None else len(df))
          print('=== 전종목 시세 (KRX 포털 직접) ===')
          df2 = stock.get_market_ohlcv_by_ticker('20260605', market='KOSPI')
          print('전종목 rows:', 0 if df2 is None else len(df2))
          print('=== 외국인 순매수 (수급) ===')
          df3 = stock.get_market_net_purchases_of_equities('20260601','20260605','KOSPI','외국인')
          print('수급 rows:', 0 if df3 is None else len(df3))
          print('=== 판정 ===')
          print('전종목>0 이면 KRX 포털 정상, 수급>0 이면 수급도 정상')
          "
