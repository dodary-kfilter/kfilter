name: 수급 스캔 자동 실행

on:
  # 언제 돌지는 시계(tools/clock.py)가 정한다 — GitHub 예약(schedule)은 이 저장소에서 제때 안 돌아서 쓰지 않는다(2026-11-16)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 라이브러리 설치
        run: pip install requests

      - name: 스캐너 실행
        run: python scanner.py
        env:
          RUN_TRIGGER: ${{ github.event_name }}

      - name: 결과 커밋
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          # 파이썬 캐시는 커밋하지 않는다
          rm -rf __pycache__
          git rm -r --cached __pycache__ --ignore-unmatch -q || true
          git add -A
          git commit -m "데이터 갱신 $(date -u +%Y-%m-%d)" || { echo "변경 없음"; exit 0; }
          # 스캔(3~5분) 사이에 다른 수집이 main에 먼저 올리면 그냥 push는 거절된다(10/29 자료 갱신 버튼 시험에서 실패) — 받아 합치고 다시
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1
