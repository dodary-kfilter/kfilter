name: 수급 스캔 자동 실행

on:
  schedule:
    # 매 평일 한국시간 19:00 (UTC 10:00) 실행. 장 마감(시간외 18:00) + 수급 확정 후.
    # ※ GitHub 스케줄은 부하 시 지연될 수 있어 실제 실행은 다소 늦어질 수 있음(데이터엔 무해).
    - cron: '0 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 라이브러리 설치
        run: pip install requests

      - name: 스캐너 실행
        run: python scanner.py
        env:
          RUN_TRIGGER: ${{ github.event_name }}

      - name: 결과 커밋
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "데이터 갱신 $(date -u +%Y-%m-%d)" || echo "변경 없음"
          git push
