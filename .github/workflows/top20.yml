name: TOP 20 자동 갱신

on:
  schedule:
    # 매주 토요일 08:30 한국시간(= 금요일 23:30 UTC) — 국장·미장 모두 금요일 종가가 나온 뒤
    - cron: '30 23 * * 5'
  push:
    # 이 파일이나 갱신기를 고치면 한 번 돈다
    branches: [main]
    paths: ['.github/workflows/top20.yml', 'top20/tools/build.py']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 계산 (안정형 20·공격형 20 — 시장 몫·폭은 새로, 종목 판단은 top20/judgments.json 그대로)
        run: python3 top20/tools/build.py

      - name: 결과 커밋
        # 파일을 올려서 돈 시험 실행은 커밋하지 않는다(장중이면 미장 가격이 중간값이라) — 예약·수동 실행만 커밋
        if: ${{ github.event_name != 'push' }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add top20/top20.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "TOP 20 숫자 자동 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1
