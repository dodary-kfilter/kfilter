name: 깔때기 재료

# 매일 판단(07:30) 전에 업종 추세·미장 기업 재무와 공시·국장 공시 사건을 모은다 — tools/sector_fetch.py · us_fund_fetch.py · kr_events_fetch.py
#   시계가 부른다: 06:40 · 12:10(장중 공시) 한국시간, 13F 새 분기가 들어오면 후보 표를 다시 만들려고 한 번 더
#   국장 기업 숫자(lists/kr_fund.json)는 수급 스캔(update.yml)이 함께 만든다
on:
  # 언제 돌지는 시계(tools/clock.py)가 정한다 — GitHub 예약(schedule)은 이 저장소에서 제때 안 돌아서 쓰지 않는다(2026-11-16)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materials
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 업종 추세
        run: python3 tools/sector_fetch.py
      - name: 미장 재무·추세·공시 사건
        run: python3 tools/us_fund_fetch.py
      - name: 국장 공시 사건
        run: python3 tools/kr_events_fetch.py
      - name: 거르기(업종·기업 점수 → 후보)
        run: python3 tools/funnel_screen.py
      - name: 결과 커밋
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add lists/sectors.json lists/us_fund.json lists/events.json lists/candidates.json
          git commit -m "깔때기 재료 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')" || { echo "변경 없음"; exit 0; }
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1
