<!DOCTYPE html>
<!-- build: 2026-08-21a (검색 — 미국 종목 한글명 사전 101종목, 티커·한글 양방향) / 이전: 2026-08-20a (목표가 자각) -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>수급 필터 · 외국인 · 연기금</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e14; --panel:#111722; --line:#1e2733;
    --txt:#e6edf3; --dim:#8b98a9;
    --foreign:#3fb950; --pension:#d29922; --both:#f778ba; --port:#58a6ff;
    --kospi:#58a6ff; --kosdaq:#bc8cff; --red:#ef5350;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--bg); color:var(--txt);
    font-family:'IBM Plex Sans KR',sans-serif; -webkit-font-smoothing:antialiased; line-height:1.5;
    background-image:radial-gradient(circle at 20% 0%, #131c2b 0%, transparent 45%),
                     radial-gradient(circle at 85% 100%, #14130f 0%, transparent 40%);
    min-height:100vh;
  }
  .wrap{max-width:920px; margin:0 auto; padding:28px 18px 80px}
  header{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;
    padding-bottom:18px; border-bottom:1px solid var(--line)}
  h1{font-size:20px; font-weight:700; letter-spacing:-0.3px; display:flex; align-items:center; gap:10px}
  h1::before{content:"●"; color:var(--foreign); font-size:13px; animation:pulse 2.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .meta{font-family:'Space Mono',monospace; font-size:12px; color:var(--dim); text-align:right}
  .meta b{color:var(--txt); font-weight:700}
  .rule{font-size:12.5px; color:var(--dim); background:var(--panel); border:1px solid var(--line);
    border-left:3px solid var(--foreign); border-radius:8px; padding:11px 14px; margin:18px 0}
  .rule b{color:var(--txt)}
  .tabs{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap}
  .tab{flex:1; min-width:90px; background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:13px 10px; cursor:pointer; text-align:center; transition:all .15s}
  .tab .c{font-family:'Space Mono',monospace; font-size:24px; font-weight:700}
  .tab .l{font-size:12px; color:var(--dim); margin-top:2px}
  .tab[data-k="foreign"] .c{color:var(--foreign)}
  .tab[data-k="pension"] .c{color:var(--pension)}
  .tab[data-k="both"] .c{color:var(--both)}
  .tab[data-k="value_pick"] .c{color:#3fb950}
  .tab[data-k="momentum"] .c{color:#f0883e}
  .tab[data-k="search"] .c{color:#8b949e; font-size:20px}
  .tab.active[data-k="search"]{border-color:#8b949e}
  .tab.active[data-k="value_pick"]{border-color:#3fb950}
  .tab.active[data-k="momentum"]{border-color:#f0883e}
  .tab.active[data-k="foreign"]{border-color:var(--foreign)}
  .tab.active[data-k="pension"]{border-color:var(--pension)}
  .tab.active[data-k="both"]{border-color:var(--both)}
  .tab[data-k="portfolio"] .c{color:var(--port)}
  .tab.active[data-k="portfolio"]{border-color:var(--port)}
  table{width:100%; border-collapse:collapse; font-size:14px}
  thead th{text-align:left; font-size:11.5px; font-weight:600; color:var(--dim); text-transform:uppercase;
    letter-spacing:.5px; padding:10px 12px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg)}
  thead th.num{text-align:right}
  tbody td{padding:12px; border-bottom:1px solid var(--line)}
  tbody tr:hover{background:#0e1620}
  .rank{font-family:'Space Mono',monospace; color:var(--dim); width:34px}
  .tag{font-family:'Space Mono',monospace; font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:5px; letter-spacing:.5px}
  .tag.KOSPI{color:var(--kospi); background:rgba(88,166,255,.12)}
  .tag.KOSDAQ{color:var(--kosdaq); background:rgba(188,140,255,.12)}
  .tag.port{color:var(--port); background:rgba(88,166,255,.12)}
  .psub{color:var(--dim); font-size:11px}
  .name{font-weight:600; white-space:nowrap}
  .tw{overflow-x:auto; -webkit-overflow-scrolling:touch}
  .name a{color:inherit; text-decoration:none; border-bottom:1px dotted var(--line)}
  .name a:hover{color:var(--foreign)}
  .code{font-family:'Space Mono',monospace; font-size:11.5px; color:var(--dim); margin-top:2px}
  .num{text-align:right; font-family:'Space Mono',monospace}
  .net{font-weight:700}
  .days{color:var(--dim)}
  .mkt-head{font-family:'Space Mono',monospace; font-size:12px; font-weight:700; letter-spacing:1px;
    margin:22px 0 6px; padding-bottom:4px; display:flex; align-items:center; gap:8px}
  .mkt-head span{font-weight:400; color:var(--dim)}
  .mkt-head.kospi{color:var(--kospi); border-bottom:1px solid rgba(88,166,255,.25)}
  .mkt-head.kosdaq{color:var(--kosdaq); border-bottom:1px solid rgba(188,140,255,.25)}
  .mkt-head:first-child{margin-top:4px}
  .loading,.empty{text-align:center; color:var(--dim); padding:50px 0; font-size:14px}
  .refresh{margin-top:24px; display:flex; justify-content:center; align-items:center; gap:10px; flex-wrap:wrap}
  .refresh button{font-family:'IBM Plex Sans KR',sans-serif; font-size:13px; font-weight:600; color:var(--txt);
    background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 22px; cursor:pointer; transition:all .15s}
  .refresh button:hover{border-color:var(--foreign); color:var(--foreign)}

  /* ── 동시 펼침 카드 ── */
  .cards{display:flex; flex-direction:column; gap:8px; margin-top:4px}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden}
  .card-h{display:flex; align-items:center; gap:10px; padding:12px 14px; cursor:pointer; flex-wrap:wrap}
  .card-h:hover{background:#0e1620}
  .card-h .rank{font-family:'Space Mono',monospace; color:var(--dim); font-size:13px; width:18px; flex:none}
  .cn{font-weight:600; display:flex; align-items:center; gap:7px; min-width:0}
  .cn a{color:inherit; text-decoration:none; border-bottom:1px dotted var(--line); white-space:nowrap}
  .cn a:hover{color:var(--both)}
  .cmid{flex:1; min-width:0; display:flex; flex-direction:column; gap:3px}
  .cs{display:flex; gap:12px; font-family:'Space Mono',monospace; font-size:11.5px; flex-wrap:wrap}
  .copybtn{font-family:'IBM Plex Sans KR',sans-serif; font-size:11.5px; font-weight:600; color:var(--both);
    background:rgba(247,120,186,.1); border:1px solid rgba(247,120,186,.4); border-radius:7px;
    padding:6px 10px; cursor:pointer; white-space:nowrap; flex:none; transition:all .15s}
  .copybtn:hover{background:rgba(247,120,186,.2)}
  .copybtn.copied{color:var(--foreign); border-color:var(--foreign); background:rgba(63,185,80,.14)}
  .srow{display:flex; gap:8px; margin-bottom:14px}
  .sinput{flex:1; background:var(--card); border:1px solid var(--line); border-radius:9px;
    padding:11px 14px; font-size:14px; color:var(--fg); font-family:inherit; outline:none}
  .sinput:focus{border-color:var(--both)}
  .sinput::placeholder{color:#59636e}
  .sbtn{background:var(--card); border:1px solid var(--line); border-radius:9px; padding:11px 18px;
    font-size:13px; font-weight:600; color:var(--dim); cursor:pointer; font-family:inherit; white-space:nowrap}
  .sbtn:hover{color:var(--fg); border-color:var(--both)}
  .sec{margin-bottom:18px}
  .sechd{font-size:12px;color:var(--dim);font-weight:700;padding:0 2px 8px}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
  .prow{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .pname{font-size:14px; min-width:0; word-break:break-word; line-height:1.45}
  .pcode{color:var(--dim);font-size:11px;font-family:ui-monospace,monospace}
  /* 스크리닝·검색 카드 전용 서브라인 (기존 .psub와 분리) */
  .pinfo{font-size:12px;color:var(--dim);margin-top:5px;line-height:1.6; word-break:keep-all}
  .pcard .copybtn{flex:none}
  .refresh button.screenbtn{font-family:'IBM Plex Sans KR',sans-serif; font-size:13px; font-weight:700; color:#fff;
    background:linear-gradient(135deg,#58a6ff,#a371f7); border:none; border-radius:8px;
    padding:10px 22px; cursor:pointer; white-space:nowrap;
    box-shadow:0 2px 10px rgba(88,166,255,.28); transition:all .15s}
  .refresh button.screenbtn:hover{transform:translateY(-1px); box-shadow:0 4px 14px rgba(88,166,255,.42); color:#fff; border:none}
  .refresh button.screenbtn:active{transform:translateY(0)}
  .refresh button.screenbtn.copied{background:linear-gradient(135deg,#3fb950,#2ea043)}
  .chev{color:var(--dim); transition:transform .2s; flex:none; font-size:13px}
  .card.open .chev{transform:rotate(180deg)}
  .card-b{display:none; padding:0 14px 14px; border-top:1px solid var(--line)}
  .card.open .card-b{display:block}
  .en-empty{color:var(--dim); font-size:12.5px; padding:14px 0}
  .en-hero{padding:14px 0 4px}
  .en-price{display:flex; align-items:baseline; gap:10px}
  .en-price .pv{font-family:'Space Mono',monospace; font-size:26px; font-weight:700}
  .en-price .pc{font-family:'Space Mono',monospace; font-size:14px; font-weight:700}
  .en-52{margin-top:10px}
  .en-52bar{height:6px; background:#1b2430; border-radius:3px; overflow:hidden}
  .en-52bar i{display:block; height:100%; background:linear-gradient(90deg,var(--kospi),var(--both))}
  .en-52lab{display:flex; justify-content:space-between; font-family:'Space Mono',monospace; font-size:10.5px; color:var(--dim); margin-top:4px}
  .en-52lab b{color:var(--txt)}
  .en-line{display:flex; gap:8px; align-items:center; font-size:12.5px; padding:6px 0}
  .en-k,.vg-k{color:var(--dim); font-size:11px}
  .en-line b{font-family:'Space Mono',monospace}
  .en-sec{padding:12px 0; border-top:1px solid var(--line)}
  .en-h{font-family:'Space Mono',monospace; font-size:10.5px; font-weight:700; color:var(--dim); text-transform:uppercase; letter-spacing:.6px; margin-bottom:8px}
  .ma-row{display:flex; gap:7px; flex-wrap:wrap; align-items:center}
  .ma-chip{background:#0e1620; border:1px solid var(--line); border-radius:6px; padding:4px 9px; font-size:12px}
  .ma-chip b{font-family:'Space Mono',monospace; margin-left:5px; font-size:11.5px}
  .badge-al{background:rgba(63,185,80,.14); color:var(--foreign); border-radius:6px; padding:4px 9px; font-size:11px; font-weight:700; font-family:'Space Mono',monospace}
  .pk{display:flex; align-items:center; gap:8px; margin:4px 0; font-family:'Space Mono',monospace; font-size:11px}
  .pk-r{color:var(--dim); width:128px; flex:none}
  .pk-bar{flex:1; height:8px; background:#1b2430; border-radius:4px; overflow:hidden}
  .pk-bar i{display:block; height:100%; background:var(--pension)}
  .pk-v{width:42px; text-align:right; color:var(--txt)}
  .vg{display:grid; grid-template-columns:1fr 1fr; gap:6px 14px}
  .vg-c{display:flex; justify-content:space-between; align-items:baseline; border-bottom:1px dotted #1b2430; padding-bottom:3px}
  .vg-c b{font-family:'Space Mono',monospace; font-size:12.5px}
  .vg-cap{font-family:'Space Mono',monospace; font-size:11px; color:var(--dim); margin-top:7px}
  .cons{display:flex; gap:18px; flex-wrap:wrap}
  .cons-c{display:flex; flex-direction:column; gap:2px}
  .cons-c b{font-family:'Space Mono',monospace; font-size:15px}
  .rp{display:flex; gap:8px; align-items:baseline; padding:4px 0; font-size:12px; border-bottom:1px dotted #1b2430}
  .rp-f{color:var(--kospi); flex:none; width:84px; font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .rp-t{flex:1; min-width:0}
  .rp-d{font-family:'Space Mono',monospace; color:var(--dim); font-size:10.5px; flex:none}
  .peer-row{display:flex; gap:8px; flex-wrap:wrap}
  .peer{background:#0e1620; border:1px solid var(--line); border-radius:6px; padding:4px 9px; font-size:11.5px}
  .peer b{font-family:'Space Mono',monospace; margin-left:4px; font-size:11px}
  .nw{display:block; padding:6px 0; border-bottom:1px dotted #1b2430; text-decoration:none; color:inherit}
  .nw:hover .nw-t{color:var(--both)}
  .nw-t{display:block; font-size:12.5px; line-height:1.45}
  .nw-m{display:block; font-family:'Space Mono',monospace; font-size:10px; color:var(--dim); margin-top:2px}
  .hd-r{display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:flex-end}
  /* 헤더 버튼 — 배경에 묻히지 않게 굵은 글씨 + 뚜렷한 테두리·색 */
  .hdbtn{font-family:'IBM Plex Sans KR',sans-serif; font-size:13px; font-weight:700;
    border-radius:9px; padding:9px 16px; cursor:pointer; transition:all .15s; white-space:nowrap;
    border:1.5px solid; letter-spacing:-0.2px}
  .hdbtn:active{transform:translateY(1px)}
  /* 새로고침 — 파랑 */
  .hdbtn.reload{color:#58a6ff; border-color:#58a6ff; background:rgba(88,166,255,.10)}
  .hdbtn.reload:hover{color:#fff; background:#1f6feb; border-color:#1f6feb;
    box-shadow:0 2px 10px rgba(88,166,255,.35)}
  /* 모바일 — 헤더 세로 정렬, 버튼 나란히 폭 채움 */
  @media(max-width:560px){
    header{flex-direction:column; align-items:stretch; gap:10px}
    .hd-r{justify-content:space-between; gap:8px}
    .hd-r .meta{width:100%; text-align:right; order:3}
    .hdbtn{flex:1; text-align:center; padding:10px 8px}
  }

  @media(max-width:560px){
    /* 헤더 — 모바일에선 [제목|버튼2개] 한 줄, 갱신시각은 아래 줄로 내린다(3줄 난립 방지) */
    header{gap:6px}
    h1{font-size:18px}
    .hd-r{width:100%; justify-content:space-between; gap:6px}
    .hd-r .meta{order:3; width:100%; text-align:right; font-size:10.5px}
    .hdbtn{flex:1; padding:9px 6px; font-size:12px; text-align:center}
    /* 탭 7개 — flex-wrap이면 마지막 줄이 늘어나 불균형. 균등 그리드로 고정한다. */
    .tabs{display:grid; grid-template-columns:repeat(4,1fr); gap:6px}
    .tab{min-width:0; padding:10px 4px}
    .tab .c{font-size:19px}
    .tab .l{font-size:10.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
    .refresh{flex-direction:column; gap:8px}.refresh button{width:100%; max-width:320px}.code-col{display:none}tbody td{padding:11px 8px; font-size:13px}thead th{padding:9px 8px}.tab .c{font-size:20px}
    .pk-r{width:104px} .vg{gap:6px 10px} .copybtn{padding:6px 8px; font-size:10.5px}}
  @media(max-width:380px){ .tabs{grid-template-columns:repeat(3,1fr)} .tab .l{font-size:10px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>수급 필터</h1>
    <div class="hd-r">
      <button class="hdbtn reload" onclick="hardReload()" title="캐시를 무시하고 최신 데이터를 다시 받습니다">↻ 새로고침</button>
      <div class="meta">최종 갱신 <b id="updated">—</b> · 프롬프트 <b id="pver">—</b></div>
    </div>
  </header>
  <div class="rule" id="rule">판정 기준을 불러오는 중…</div>
  <div class="tabs">
    <div class="tab active" data-k="foreign" onclick="show('foreign')"><div class="c" id="c-foreign">—</div><div class="l">외국인</div></div>
    <div class="tab" data-k="pension" onclick="show('pension')"><div class="c" id="c-pension">—</div><div class="l">연기금</div></div>
    <div class="tab" data-k="both" onclick="show('both')"><div class="c" id="c-both">—</div><div class="l">동시 수급</div></div>
    <div class="tab" data-k="value_pick" onclick="show('value_pick')"><div class="c" id="c-value_pick">—</div><div class="l">저가매수</div></div>
    <div class="tab" data-k="momentum" onclick="show('momentum')"><div class="c" id="c-momentum">—</div><div class="l">모멘텀</div></div>
    <div class="tab" data-k="portfolio" onclick="show('portfolio')"><div class="c" id="c-portfolio">—</div><div class="l">관심종목</div></div>
    <div class="tab" data-k="search" onclick="show('search')"><div class="c" id="c-search">🔍</div><div class="l">종목 검색</div></div>
  </div>
  <div id="content"><div class="loading">데이터를 불러오는 중…</div></div>
  <div class="refresh">
    <button onclick="hardReload()">새로고침</button>
    <button id="screenbtn" class="screenbtn" onclick="copyScreen(event)">일괄 스크리닝 프롬프트</button>
  </div>
</div>
<script>
let DATA=null, CUR='foreign';
const IS_MOBILE = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
function naverUrl(code){
  return IS_MOBILE
    ? 'https://m.stock.naver.com/domestic/stock/'+code+'/total'
    : 'https://finance.naver.com/item/frgn.naver?code='+code;
}
function fmt(n){return (n>=0?'+':'')+n.toLocaleString('ko-KR');}
function bc(d){ return parseInt(String(d).split('/')[0],10)||0; }

// ── 외국인/연기금 탭 (단일 기준) ──
function rowSingle(it,i){
  return `<tr><td class="rank">${i}</td>
    <td><div class="name"><a href="${naverUrl(it.code)}" target="_blank">${it.name}</a></div>
      <div class="code code-col">${it.code}</div></td>
    <td class="num net">${fmt(it.net)}</td>
    <td class="num days">${it.buydays}</td></tr>`;
}
function sectionSingle(title, list, cls){
  if(list.length===0) return '';
  list=list.slice().sort((x,y)=> bc(y.buydays)-bc(x.buydays) || y.net-x.net);
  let rows=list.map((it,idx)=>rowSingle(it,idx+1)).join('');
  return `<div class="mkt-head ${cls}">${title} <span>${list.length}</span></div>
    <div class="tw"><table><thead><tr><th>#</th><th>종목</th>
      <th class="num">누적순매수(주)</th><th class="num">순매수일</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

// ── 동시 탭 (외국인·연기금 둘 다) — 펼침 카드 + 분석 패널 ──
function won(n){ return (n==null)?'—':Math.round(n).toLocaleString('ko-KR'); }
function volShort(n){
  if(n==null) return '—';
  const s=n<0?'-':'+', a=Math.abs(n);
  if(a>=1e8) return s+(a/1e8).toFixed(1)+'억';
  if(a>=1e4) return s+Math.round(a/1e4).toLocaleString('ko-KR')+'만';
  return s+a.toLocaleString('ko-KR');
}
function sgn(n,suf){ return n==null?'—':((n>=0?'+':'')+n+(suf||'')); }
function colNum(n){ return n==null?'var(--dim)':(n>=0?'var(--foreign)':'var(--red)'); }
function arr(n){ return n==null?'':(n>=0?'▲':'▼'); }
function ymd(s){ s=String(s||''); return s.length>=8? s.slice(4,6)+'/'+s.slice(6,8):s; }
function hhmm(s){ s=String(s||''); return s.length>=12? s.slice(4,6)+'/'+s.slice(6,8)+' '+s.slice(8,10)+':'+s.slice(10,12):s; }
function esc(s){ return String(s==null?'':s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }

function renderEnrich(en){
  if(!en) return '<div class="en-empty">분석 데이터 없음 — 다음 스캔에서 채워집니다.</div>';
  let h='';
  if(en.now!=null){
    const p=en.pos52w||{};
    h+=`<div class="en-hero"><div class="en-price">
        <span class="pv">${won(en.now)}</span>
        <span class="pc" style="color:${colNum(en.changePct)}">${arr(en.changePct)} ${sgn(en.changePct,'%')}</span></div>`;
    if(p.pct!=null){

    h+='</div>';
    if(en.trend20!=null) h+=`<div class="en-line"><span class="en-k">20일 추이</span><b style="color:${colNum(en.trend20)}">${arr(en.trend20)} ${sgn(en.trend20,'%')}</b></div>`;
  }
  if(en.ma){
    const vs=en.ma.vs||{};
    const chip=(lab,v)=>`<span class="ma-chip">${lab}<b style="color:${colNum(v)}">${arr(v)}${v==null?'':Math.abs(v)+'%'}</b></span>`;
    h+=`<div class="en-sec"><div class="en-h">이평선 · 현재가 대비</div><div class="ma-row">
      ${chip('5',vs.ma5)}${chip('20',vs.ma20)}${chip('60',vs.ma60)}${chip('120',vs.ma120)}

  if(en.pocket&&en.pocket.length){
    const bars=en.pocket.map(p=>`<div class="pk"><span class="pk-r">${won(p.low)}~${won(p.high)}</span>
      <span class="pk-bar"><i style="width:${Math.min(100,p.volPct*3)}%"></i></span>
      <span class="pk-v">${p.volPct}%</span></div>`).join('');
    h+=`<div class="en-sec"><div class="en-h">매물대 · 거래량 상위</div>${bars}</div>`;
  }
  const v=en.valuation;
  if(v){
    const cell=(k,val,suf)=>`<div class="vg-c"><span class="vg-k">${k}</span><b>${val==null?'—':won(val)+(suf||'')}</b></div>`;
    h+=`<div class="en-sec"><div class="en-h">밸류에이션</div><div class="vg">
      ${cell('PER',v.per,'배')}${cell('추정PER',v.fwdPer,'배')}
      ${cell('PBR',v.pbr,'배')}${cell('배당',v.divYield,'%')}
      ${cell('EPS',v.eps,'원')}${cell('추정EPS',v.fwdEps,'원')}
      ${cell('BPS',v.bps,'원')}${cell('외인소진',v.foreignRate,'%')}
      </div>${v.marketCap?`<div class="vg-cap">시총 ${esc(v.marketCap)}</div>`:''}</div>`;
  }
  const c=en.consensus;
  if(c&&(c.target!=null||c.opinion!=null)){
    h+=`<div class="en-sec"><div class="en-h">증권가 컨센서스</div><div class="cons">
      ${c.target!=null?`<span class="cons-c"><span class="vg-k">목표주가</span><b>${won(c.target)}</b></span>`:''}
      ${c.upsidePct!=null?`<span class="cons-c"><span class="vg-k">괴리율</span><b style="color:${colNum(c.upsidePct)}">${sgn(c.upsidePct,'%')}</b></span>`:''}
      ${c.opinion!=null?`<span class="cons-c"><span class="vg-k">투자의견</span><b>${c.opinion}</b></span>`:''}
      </div></div>`;
  }
  if(en.reports&&en.reports.length){
    const r=en.reports.map(x=>`<div class="rp"><span class="rp-f">${esc(x.firm)}</span><span class="rp-t">${esc(x.title)}</span><span class="rp-d">${ymd(x.date)}</span></div>`).join('');
    h+=`<div class="en-sec"><div class="en-h">증권가 리포트</div>${r}</div>`;
  }
  if(en.peers&&en.peers.length){
    const p=en.peers.map(x=>`<span class="peer">${esc(x.name)} <b style="color:${colNum(x.changePct)}">${sgn(x.changePct,'%')}</b></span>`).join('');
    h+=`<div class="en-sec"><div class="en-h">동일업종</div><div class="peer-row">${p}</div></div>`;
  }
  if(en.news&&en.news.length){
    const n=en.news.map(x=>`<a class="nw" href="${x.url||'#'}" target="_blank">
      <span class="nw-t">${esc(x.title)}</span><span class="nw-m">${esc(x.office)} · ${hhmm(x.date)}</span></a>`).join('');
    h+=`<div class="en-sec"><div class="en-h">최근 뉴스</div>${n}</div>`;
  }
  return h;
}

function cardBoth(it,i){
  const tag = it.market==='KOSDAQ'?'KOSDAQ':'KOSPI';
  return `<div class="card" data-code="${it.code}">
    <div class="card-h" onclick="toggleCard('${it.code}')">
      <span class="rank">${i}</span>
      <div class="cmid">
        <span class="cn"><a href="${naverUrl(it.code)}" target="_blank" onclick="event.stopPropagation()">${esc(it.name)}</a>
          <span class="tag ${tag}">${tag}</span></span>
        <span class="cs">
          <b style="color:var(--foreign)">외 ${volShort(it.f_net)} ${it.f_buydays}</b>
          <b style="color:var(--pension)">연 ${volShort(it.p_net)} ${it.p_buydays}</b></span>
      </div>
      <button class="copybtn" onclick="copyPrompt(event,'${it.code}')" title="리포트 프롬프트 → Claude에 붙여넣기">프롬프트</button>
      <span class="chev">⌄</span>
    </div>
    <div class="card-b">${renderEnrich(it.enrich)}</div>
  </div>`;
}
function sectionBoth(title, list, cls){
  if(list.length===0) return '';
  list=list.slice().sort((x,y)=> bc(y.f_buydays)-bc(x.f_buydays) || y.f_net-x.f_net);
  const cards=list.map((it,idx)=>cardBoth(it,idx+1)).join('');
  return `<div class="mkt-head ${cls}">${title} <span>${list.length}</span></div>
    <div class="cards">${cards}</div>`;
}
function toggleCard(code){
  const card=document.querySelector('.card[data-code="'+code+'"]');
  if(card) card.classList.toggle('open');
}
// ── 내 종목(포트폴리오) 탭 — 보유 종목 카드 ──
function cardPort(it,i){
  const t=it.ptype;
  const isRef=!!it.ref;                 // 파생(기초자산 재사용) 여부
  const isSector=(t==='sector');
  const isUS=(t==='us');
  const badge = isUS?'미국' : isSector?'섹터' : it.basis?'지수' : (isRef?'파생':'일반');
  const sup=it.supply||{};
  let supHtml;
  if(isUS){
    supHtml='<b style="color:#6e7681">수급 N/A (미국)</b>';
  }else if(it.supply && sup.foreign_net_10d!=null){
    const fc=sup.foreign_pass?'var(--foreign)':'#6e7681';
    const pc=sup.pension_pass?'var(--pension)':'#6e7681';
    const flabel=isSector?'외합':'외', plabel=isSector?'연합':'연';
    supHtml=`<b style="color:${fc}">${flabel} ${volShort(sup.foreign_net_10d)} ${sup.foreign_buydays||''}</b>`
          + `<b style="color:${pc}">${plabel} ${volShort(sup.pension_net_10d)} ${sup.pension_buydays||''}</b>`;
  }else{
    supHtml='<b style="color:#6e7681">수급 N/A</b>';
  }
  const sub = isUS ? ('→ '+esc(it.us_target||'')+' 분석')
            : isSector ? ('구성 '+((it.supply&&it.supply.sector_members)||[]).map(m=>esc(m.name)).join('·'))
            : it.basis ? ('기초: '+esc(it.basis))
            : (isRef ? ('→ 기초자산 분석') : '');
  const body = isUS
    ? `<div class="en-empty">미국 종목 — ${esc(it.us_target||'')}(${esc(it.us_ticker||'')})을 웹 검색으로 분석합니다. ‘프롬프트’ 버튼을 누르세요.</div>`
    : isSector
    ? `<div class="en-empty">${esc(it.basis||'섹터')} 구성종목 ${(((it.supply&&it.supply.sector_members)||[]).length)}종목의 수급·추이·뉴스를 총괄 분석합니다. ‘프롬프트’ 버튼을 누르세요.</div>`
    : isRef
    ? `<div class="en-empty">기초자산(${it.ref})으로 분석합니다. ‘프롬프트’ 버튼을 누르세요.</div>`
    : renderEnrich(it.enrich);
  return `<div class="card" data-code="${it.code}">
    <div class="card-h" onclick="toggleCard('${it.code}')">
      <span class="rank">${i}</span>
      <div class="cmid">
        <span class="cn"><a href="${naverUrl(it.code)}" target="_blank" onclick="event.stopPropagation()">${esc(it.name)}</a>
          <span class="tag port">${badge}</span></span>
        <span class="cs">${supHtml}${sub?`<span class="psub">${sub}</span>`:''}</span>
      </div>
      <button class="copybtn" onclick="copyPrompt(event,'${it.code}')" title="리포트 프롬프트 → Claude에 붙여넣기">프롬프트</button>
      <span class="chev">⌄</span>
    </div>
    <div class="card-b">${body}</div>
  </div>`;
}
function sectionPort(list){
  const cards=list.map((it,idx)=>cardPort(it,idx+1)).join('');
  return `<div class="cards">${cards}</div>`;
}

목표는 계산이 아니라 예측이다. 다 본 뒤에 확률이 가장 높은 값을 부르는 것이지 보수적일 필요도 공격적일 필요도 없다.
★값을 올리는 것과 내리는 것을 다 꺼낸 뒤 무게를 정하고, 왜 그 값인지로 닫아라. 한쪽만 쓰고 값을 부르지 마라. 반대편이 없으면 안 찾은 것이다.
★"그래서 왜 이 값인가"를 닫는 문단이 리포트에서 제일 무거운 자리다. 여기서 지면 나머지가 다 맞아도 진다.
  ❌ "두 분기 연속 개선이 더 무겁다고 봐서 목표를 올려 잡았다" — 무엇이 얼마나 무거운지가 없다.
  ⭕ "네 분기 연속 올라온 마진이 이익 기준 배수를 7.88배까지 눌러놓은 것을 가장 무겁게 보되, 100조원이 회사 확인 없는 기대이고 순자산으로는 이미 이론값에 닿아 있어 그 위를 크게 부르지는 못한다고 판단해 6월 고점을 조금 넘는 자리를 부른다."
틀릴 수 있다는 걸 알고 부르는 것이다. 확답이 아니라 확률이다. 무엇을 근거로 쟀는지가 값 자체보다 중요하고, 독자가 그 근거에 동의하지 않으면 달리 판단할 수 있어야 한다.
팩터는 종목마다 다르므로 목록을 주지 않는다. 괄호 안의 예시는 체크리스트가 아니다. 해당 없는 항목을 나열하지 마라 — 한둘이지 일곱이 아니다.
★배수만으로 목표를 만들지 마라. 배수는 관찰이지 근거가 아니고, 부른 값을 검산할 때 쓴다.
목표를 만든 팩터가 곧 목표를 깨는 것이다. 같은 축에서 나온다.
설명이 길어져도 된다. 단 팩터를 밝히는 설명일 때만이다. 길이는 팩터 개수가 정하지, 개수를 맞추려 만들거나 분량을 맞추려 빼지 마라. 버릴 것은 팩터가 아니라 군더더기다.

[★★안전한 값을 부르지 마라]
계산으로 정당화되는 만큼만 잡지 마라. 근거는 문장으로 대면 된다.
이건 채점받는 문서가 아니라 판단을 남기는 문서다. 틀린 예측이 무응답보다 낫다.
★확률이 가장 높은 자리를 불러라. 신고가면 신고가고 신저가면 신저가다.
전고점과 52주 고저는 상한도 하한도 기준도 아니다. 신고가라는 사실 자체는 부담이 아니고, 이익이 그때보다 커야만 넘는 것도 아니다. 52주 저가 아래를 부르는 것도 그대로 매도다.
  ❌ "고점 대비 20% 남았으니 그 안에서" / "저점 대비 벌써 30% 올라 여력이 적다" — 위치는 근거가 아니다.
계산이 서는 다른 축으로 갈아타지 마라. 이익이 커지는데 목표를 낮게 잡는 것이 틀린 예측보다 큰 잘못이다.

[★등급]
매수 / 중립 / 매도 셋이고 기대수익이 정한다. 강도는 대량·소량으로 붙인다.
★강도는 팩터 개수가 아니라 무게다. 세는 것이 아니라 재는 것이다. 무게는 이렇게 잰다.
  확인 시점이 가까울수록 / 아직 값에 안 들어갔을수록 / 깨졌을 때 남는 게 없을수록 / 확정된 사실일수록 무겁다.
무게는 국면에 따라 바뀐다. 패턴으로 환산하지 마라. 잰 과정을 문장으로 쓰면 그게 결론이다.
비중이나 투자 규모를 숫자로 쓰지 마라. 진입가·눌림 대기·분할매수도 쓰지 마라(위 2의 조건 규칙과 같다).
"매수(눌림 대기)"는 매수가 아니다. 지금 안 사면 중립이다.
목표를 못 부르겠으면 왜 못 부르는지를 쓰고 중립으로 간다.

[★분량]
살 만하면 3을 충분히 쓰고, 팩터를 못 밝혔거나 값이 이미 찼으면 짧다.
안 써도 되는 것을 쓰지 마라. 분량을 채우려 자료를 끌어오지 마라. 독자가 결론 전에 지치면 실패다.
길어도 되는 곳은 회사 소개, 최근 국면 설명, 마지막 총평이다.
★줄일 곳은 기술적 분석이다. 이평선과의 거리·매물대·급등 직후는 목표까지 가는 길을 설명하는 재료일 뿐 등급도 목표도 바꾸지 않는다.
  ⭕ "280,000원 위로는 쌓인 물량이 얇아 한 번 뚫으면 막을 것이 별로 없다" — 한 줄이면 된다.
  ❌ "20일선 8.9%, 60일선 26.6%, 120일선 41.2% 이격" — 뒷받침 숫자만 늘어놓은 것이다.

[★'왜'를 쓰는 법]
'왜'는 다섯으로 쪼갠다 — 무엇이 일어났나 / 왜 일어났나 / 그래서 무엇이 바뀌나 / 앞으로 어떻게 되나 / 그래서 어떻게 하나.
현상은 날짜를 특정한다. "최근"이 아니라 "7월 30일"이다.
  ❌ "실적 개선 기대로 수급이 유입되고 있다" — 다섯 중 하나도 없다.
  ⭕ "8월 12일 LS전선이 미국 해저케이블 물량을 따냈다. 현지 증설이 늦어져 단가가 올라간 상태에서 잡은 계약이라 마진이 평소보다 높다. 매출은 4분기부터 잡히고, 같은 발주가 이어지면 내년 상반기까지 간다. 그래서 4분기 실적 확인 전까지는 이 축이 값을 정한다."
억지로 다섯을 채우지 마라. 문단 구성이 아니라 생각의 순서다. 번호를 리포트에 쓰지 마라.
★매크로·외부 지표는 값만 쓰지 말고 셋을 붙여라 — 왜 그 값이 됐나, 어디로 가나, 이 대상에 무엇을 하나.
  ⭕ "두바이유가 배럴당 92달러다. OPEC 감산 연장에 중동 긴장이 겹쳐 올랐고, 감산이 유지되면 90달러대가 이어진다. 이 회사는 원료비가 매출의 40%라 마진이 분기당 2%p씩 깎인다."
다른 시장·종목은 연결이 설명될 때만 쓴다.
  ⭕ 가권지수(반도체 비중이 커서 같은 업황을 본다) · SOX
  ❌ 항셍·상해·닛케이를 이유 없이 나열하기. "중국이 오르고 우리가 내렸다"는 정보가 아니다.
같은 업종 종목을 끌어올 때도 무엇이 겹치는지 밝혀라.
★예측하라. "지켜봐야 한다"로 끝내지 마라.
  ⭕ "10월 초 잠정실적에서 마진이 45%를 밑돌면 이 판단은 틀린 것이다"
  ❌ "불확실하다" · "주시가 필요하다" · "변동성이 예상된다"

[★근거로 쓸 수 없는 것]
증권사 리포트 제목은 근거가 아니다. 그 안의 사실 주장은 공시·재무로 확인한 뒤에만 쓴다.
같은 날 여러 건이 나온 것은 신호가 아니다. 실적 발표 뒤 리뷰를 내는 관행이다.
매체명이나 리포트 제목을 본문에 쓰지 마라.
  ❌ "8월 13일 이데일리가 수주 확대를 보도했다" → ⭕ "미국 타워 물량과 단가가 함께 올라간 상태다"
★증권사 목표주가는 내 목표를 부른 뒤에 연다. 먼저 보면 그 값에 끌려간다.
  용도는 하나뿐이다 — 내 값이 시장보다 앞서 있나 뒤처져 있나 점검하는 것. 그대로 옮기지 마라.
컨센서스 상승여력으로 종목을 고르거나 빼지 마라.
스캔 지표와 실시간 값이 다르면 실시간을 쓰고, 파일 값은 "N월 N일 기준"으로 구분한다.
★검색은 2회까지다. 공시·재무·DART는 제한이 없으니 검색을 늘리기 전에 그쪽을 먼저 다 뒤져라.

[★실적을 볼 때]
잠정실적을 내는 회사인가부터 본다. 안 내면 보고서 제출일이 곧 재료일이고, 급등락일과 제출일이 같으면 거기가 규명 출발점이다.
별도인가 연결인가를 확인한다. 별도만 있으면 반드시 연결로 재확인한다.
스캔 목록의 수익성 지표는 직전 확정 분기 기준이다. 실적 시즌에는 목록값 대신 공시를 본다.
★화면에 뜨는 PER·EPS는 직전 연간 확정치다. 상반기 이익을 연으로 환산해 다시 계산하고, 화면값과 차이가 크면 그 차이를 본문에 밝혀라.
  실측 — 삼성전자 화면 PER 41.03배가 실제로는 7.88배였다. 다섯 배 넘게 어긋났고 이 차이가 목표를 만들었다.
음수 PER은 적자가 아닐 수 있다. 직전 연간이 적자였고 분기는 흑자로 돌아선 경우다.
실적 시즌에는 DART 원문이 기본 경로다. ★연결 손익계산서에서 읽어라.
  실측 — 부문별 주석 합계를 전사 매출로 써서 25%를 부풀린 적이 있다(풀무원). 상반기가 연간의 절반 근처인지로 검산하라.
  부문 주석은 어디서 얼마 버는지 볼 때만 쓴다.

[★쓰지 마라 — 판단을 안 만드는 것]
· 자료 종류별로 섹션 나누기 — 수급·실적·밸류·가격은 1·2의 근거로만 나온다.
  ★답을 못 건드리는 자료는 아예 쓰지 마라.
· 긍정·부정 요인 표, 강·중·약 등급, 시나리오별 확률 배분 — 방향과 조건만 쓴다
· 수급을 시가총액으로 나눈 비율
· 매물대 비중을 %로 재기 — 어디서 막히는지만 말로 쓴다
· 이론 PBR — 결론을 바꿀 때만. 계산해놓고 다음 문장에서 무효화하지 마라
· 한 재료에 수치를 셋 넘게 붙이기 — 그중 판단을 만든 것만 남긴다
· "해당 없음"·"확인했으나 없었습니다" — 없으면 안 쓴다
· "확인하지 않았습니다" — 안 한 것이면 하고, 못 하는 것만 "확인 불가"다

[★★숫자 다루기 — 그 숫자가 무엇을 바꾸는가]
★기준은 출처가 아니라 역할이다. 받은 값이냐가 아니라, 그 숫자가 다음 판단을 만드느냐다.

★사슬 숫자 — 다음 숫자나 판단으로 이어지는 것. 정확히, 검산해서, 사슬이 보이게 다 써라.
  ⭕ "상반기 주당순이익 17,710원을 연으로 늘리면 지금 주가는 7.88배다. 하반기에 2분기 수준이 유지되면 연간 주당 39,000원대이고, 거기에 10배를 얹은 자리가 이 목표다."
  여기서는 뭉개면 안 된다. 17,710을 "약 1만 8천"으로 어림하면 배수가 달라지고 목표가 달라진다.
  현재가·목표·이평선·PER·PBR·ROE·마진·EPS·배당·시가총액이 대개 여기 속한다. 기대수익률은 직접 나눠 소수 첫째까지 쓰고, 목표를 고치면 다시 나눈다.

★뒷받침 숫자 — 이미 정해진 판단을 받쳐주기만 하는 것. ★그중 판단을 정한 하나만 쓰고 어림으로 쓴다.
  ⭕ "외국인이 60거래일 순매도를 최근 5거래일에 되돌리기 시작했고, 평균 매수단가가 328,780원으로 지금보다 15% 위다."
  ❌ 외국인 5거래일 8,547,037주 · 기관 5거래일 7,125,624주 · 기관 20거래일 7,475,599주 · 연기금 20거래일 1,156,369주 · 외국인 60거래일 8,927만주를 한 문단에 늘어놓기.
     다섯 개가 만드는 판단은 "외국인이 되사고 기관이 넘긴다" 하나뿐이다. 하나면 된다.
  고저 대비 %·기간 수익률·기여도·거래량 배수는 여기 속한다. 몇 %인지 계산하지 말고 얼마나인지를 말로 써라.
  ★"약"을 붙여 어림하되 원값을 먼저 보고 어림하라. 소수점 둘째 자리는 쓰지 마라.
    실측 — 21.9%를 30%로, 162.1억을 176억으로 쓴 적이 있다. 대조가 안 되면 어림하지 말고 원값을 그대로 써라.

★부호는 두 종류 다 예외가 없다. 샀나 팔았나, 올랐나 내렸나, 늘었나 줄었나.
  실측 — 기관 순매수를 순매도로 뒤집어 쓰는 바람에 "외국인이 사는 물량을 기관이 넘긴다"는 구도 전체가 무너졌다.
  ★국내 수급 판정은 report-data의 supply_detail을 1차 기준으로 삼아라. 다음 investor/days의 foreignStraightPurchaseVolume은 장내만 잡아서 20일 누적에서 부호까지 갈린다.

고점·저점은 종가 기준과 장중 기준이 다르다. 어느 쪽인지 밝혀라.
일별 값을 여러 개 합산했으면 그 자리에서 검산하라. "처음"·"최초"·"이후 처음"은 시계열을 실제로 훑고 나서만 쓴다.
  실측 — 1,000달러가 "이후 처음"이 아니었다. "N배"도 실제로 나눠보고 써라. 1.5배를 "두 배 넘게"로 쓴 적이 있다. 나눌 값이 없으면 방향만 쓴다.
출처가 불분명하거나 단위를 모르는 값은 쓰지 마라.
★비율 필드는 단위를 확인하라. 다음 quotes의 foreignRatio·changeRate·debtRatio는 0~1 소수이고, report-data의 recent_daily에 있는 foreignRatio는 이미 퍼센트다. 두 소스의 단위가 다르다.
  실측 — 0.48을 그대로 옮겨 외국인 지분율을 48%로 썼다. 보유주식÷상장주식으로 직접 나눠 대조하라.
★target_context는 목표를 부른 뒤에만 연다. 이 종목이 같은 기간에 실제로 올랐던 폭의 분포이지 목표를 정하는 값이 아니다.
  맞추려고 목표를 고치지 마라. 과거보다 낮아도 근거가 서면 그대로 간다. 알고 부르는 것이 쓰임의 전부다.
  부른 값이 p90이나 과거 최대를 넘으면 본문에 한 줄로 밝혀라. 표본이 5~10개뿐이라 "확률 N%"로는 쓰지 마라.
스캔 목록의 종목명은 그대로 쓴다.

[★비교 기준]
스크리닝 안에서의 순위는 판단 근거가 못 된다.
  ❌ "20개 중 세 번째" · "이 목록에서 가장 강한"
비교는 셋 중 하나다 — 절대 기준 / 시장·업종 대비 / 과거의 자신. ★시장 대비가 제일 무겁다.
  지수가 오르는데 이 대상만 빠졌다면 이 대상만의 사유가 있다는 뜻이고 그게 팩터다.
  지수가 빠지는데 버텼다면 자기 재료가 있다는 뜻이고 강한 신호다.
  같이 움직였다면 방어력이 아니라 되돌림이다.
  %p로 재지 말고 셋 중 어느 경우인지로 말하라.
★수급도 한 구간만 보고 판정하지 마라. supply_derived의 pattern에 판정이 이미 들어 있다.
  ★판정은 pattern으로 받고, recent_daily는 그 판정을 뒷받침할 값 하나를 꺼낼 때만 열어라. 60행을 직접 훑지 마라.
  ★pattern이 준 판정(반전·일관매도·혼조)을 그대로 쓰고, 구간 수치를 셋 다 늘어놓아 판정을 재연하지 마라. 갈리면 갈린다고 쓴다.
대상이 여럿이면 맨 마지막에 순서를 매겨도 된다. 한 종목이면 순위도 총평도 없다.

[★쉽게 써라]
개념 설명을 하지 마라. 읽는 사람은 투자자다.
데이터 필드명을 그대로 쓰지 마라 — 이격도는 "20일선 위로 13% 벌어져", 매물대는 "손바뀜한 물량이 많은 구간", 소진율은 "외국인 지분율", 정배열은 "단기선이 장기선 위에 있다"로.
덜 쓰이는 약어는 풀어 쓴다. 기간은 우리말로("1M"이 아니라 "최근 1개월").
숫자에는 단위와 기준을 붙여라. ❌ "이격 15.3%" → ⭕ "20일선보다 15% 위"

[★판단 규칙]
중립은 두 경우다 — 팩터를 못 밝혔거나, 팩터는 살아 있는데 값이 이미 찼거나.
  둘 다 무엇이 확인되면 사는지를 반드시 쓴다.
❌ "요인이 상쇄된다" · "확인 불가가 많아 판단 유보" · "변동성이 크다" · "지켜보자"
반대 시나리오는 조건으로 쓴다.
★밸류 함정 셋 — 업종 PER이 음수이거나 200을 넘으면 그 비교는 무효다. 분기가 흑자인데 PER이 음수면 연간 적자가 남아 있는 것이다. PBR은 절대값으로 보지 마라. ROE가 높으면 PBR이 높아도 싸다.
연기금 매수를 무조건 호재로 읽지 마라.

[★서술 규칙]
스크리닝 내부 사정을 쓰지 마라 — 필터·조건·목록·스캔 시각·통과 여부.
조건은 이미 확인된 사실이니 결과만 서술한다. ❌ "외국인 순매수 조건을 충족했다" → ⭕ "외국인이 8거래일 연속 샀다"
소제목은 실제로 답한 것을 말로 쓴다. 앞 리포트의 형식·소제목·항목 구성을 따라가지 마라.
  ❌ "수급 분석" · "밸류에이션" · "투자 포인트" · "리스크 요인"
  ⭕ "공시는 없고, 주주환원 규모에 숫자가 붙었습니다" · "10월에 두 가지가 연달아 옵니다"`;

function fmtScreenList(items, isV){
  return items.map((x,i)=>{
    const s=(x.labels&&x.labels.supply)||null, v=(x.labels&&x.labels.valuation)||{};
    const sup = s ? `외 ${s.f_buydays||'-'} ${s.f_net!=null?s.f_net.toLocaleString():''} / 연 ${s.p_buydays||'-'} ${s.p_net!=null?s.p_net.toLocaleString():''}${s.is_zero_rank?' 동시수급':''}` : '최근 10거래일 기준 조건 미달(누적>0 + 매수일 70%) — 더 긴 구간은 직접 확인이 필요합니다';
    const per = x.per!=null ? x.per.toFixed(1)+'배' : '—';
    const sec = v.sector_valid ? `업종 ${v.sectorPer.toFixed(1)}배` : '업종PER 무효';
    const base = `${i+1}. ${x.name}(${x.code}) · ${x.sector||''} · ${Math.round(x.cur).toLocaleString()}원 ${(x.changeRate>=0?'+':'')+x.changeRate.toFixed(2)}%
   PER ${per} (${sec}) · PBR ${v.pbr!=null?(+v.pbr).toFixed(2)+'배':'—'} · 시총 ${x.mcap?Math.round(x.mcap/1e8).toLocaleString()+'억':'—'}
   수급: ${sup}`;
    if(isV){
      const eq=(x.eps_quarters||[]).map(q=>`${(q.date||'').slice(0,7)} EPS ${q.eps!=null?Math.round(q.eps).toLocaleString():'—'}`).join(' | ');
      const e0=x.eps_q_recent, e1=x.eps_q_prev;
      const qoq=(e0!=null&&e1!=null&&e1>0)?(e0/e1-1)*100:null;
      const warn='';
      return base+`
   52주 고점 대비 ${x.dd_close!=null?x.dd_close.toFixed(1)+'%':'—'} · 고점일 이후 ${idxName(x)} ${x.idx_since_peak!=null?(x.idx_since_peak>=0?'+':'')+x.idx_since_peak.toFixed(1)+'%':'—'} → 지수 대비 ${x.excess_dd!=null?x.excess_dd.toFixed(1)+'%p':'—'} · 업종 대비 ${x.vs_sector_dd!=null?x.vs_sector_dd.toFixed(1)+'%p':(x.vs_sector_note||'—')}${x.sector_median_dd!=null?`(업종 중앙 ${x.sector_median_dd.toFixed(1)}%)`:''}
   매출 ${x.sales_growth!=null?(x.sales_growth>=0?'+':'')+x.sales_growth.toFixed(1)+'%':'—'} · 영업이익률 ${x.opm_prev!=null?x.opm_prev.toFixed(1):'—'}→${x.opm_recent!=null?x.opm_recent.toFixed(1)+'%':'—'}(직전 분기 대비) · 이익수익률 ${x.earn_yield!=null?x.earn_yield.toFixed(1)+'%':'—'}(연율PER ${x.per_ann!=null?x.per_ann.toFixed(1)+'배':'—'}) · ROE ${x.roe_ann!=null?x.roe_ann.toFixed(1)+'%':'—'}
   52주 고점 ${x.peak_date||'—'}(${x.peak_days!=null?x.peak_days+'일 전':'—'})
   1개월 ${x.r1!=null?x.r1.toFixed(1)+'%':'—'}${x.excess_r1!=null?`(${idxName(x)}대비 ${(x.excess_r1>=0?'+':'')+x.excess_r1.toFixed(1)}%p)`:''} · 6개월 ${x.r6!=null?x.r6.toFixed(1)+'%':'—'}${x.excess_r6!=null?`(${idxName(x)}대비 ${(x.excess_r6>=0?'+':'')+x.excess_r6.toFixed(1)}%p)`:''} · 20일선과의 거리 ${x.ma20_gap!=null?(x.ma20_gap>=0?'+':'')+x.ma20_gap.toFixed(1)+'%':'—'} · 최근 거래량(20일/60일) ${x.v2060?x.v2060.toFixed(2)+'배':'—'} · 52주 내 위치 ${x.pos52w!=null?x.pos52w.toFixed(0)+'%':'—'}${(x.r1!=null&&x.r1<=-15)?'  1개월 급락 중 — 5일선만 갓 회복한 상태입니다. 되돌림인지 바닥인지 구분이 필요합니다':''}
   최근 분기 EPS ${e0!=null?Math.round(e0).toLocaleString():'—'} (직전 분기 대비 ${x.eps_turnaround_q?'적자→흑자':(x.eps_still_loss?'적자 지속':(qoq!=null?(qoq>=0?'+':'')+qoq.toFixed(0)+'%':'—'))})${warn}
   EPS 4분기: ${eq||'—'}`;
    }
    return base+`
   정배열 ${x.entry_days}일차 · 1개월 ${x.r1.toFixed(1)}%${x.excess_r1!=null?`(${idxName(x)}대비 ${(x.excess_r1>=0?'+':'')+x.excess_r1.toFixed(1)}%p)`:''} · 6개월 ${x.r6!=null?x.r6.toFixed(1)+'%':'—'}${x.excess_r6!=null?`(${idxName(x)}대비 ${(x.excess_r6>=0?'+':'')+x.excess_r6.toFixed(1)}%p)`:''} · 20일선과의 거리 ${x.ma20_gap.toFixed(1)}%${x.ma20_gap>25?' 과열':''} · 최근 거래량(20일/60일) ${x.v2060?x.v2060.toFixed(2):'—'}배 · 52주 내 위치 ${x.pos52w!=null?x.pos52w.toFixed(0)+'%':'—'}${x.sales_growth!=null?`
   매출 ${(x.sales_growth>=0?'+':'')+x.sales_growth.toFixed(1)}% · 영업이익률 ${x.opm_prev!=null?x.opm_prev.toFixed(1):'—'}→${x.opm_recent!=null?x.opm_recent.toFixed(1)+'%':'—'}(직전 분기 대비) · 이익수익률 ${x.earn_yield!=null?x.earn_yield.toFixed(1)+'%':'—'}(연율PER ${x.per_ann!=null?x.per_ann.toFixed(1)+'배':'—'}) · ROE ${x.roe_ann!=null?x.roe_ann.toFixed(1)+'%':'—'}
   최근 분기 EPS ${x.eps_q_recent!=null?Math.round(x.eps_q_recent).toLocaleString():'—'} (직전 분기 대비 ${x.eps_turnaround_q?'적자→흑자':(x.eps_still_loss?'적자 지속':(x.eps_q_prev!=null&&x.eps_q_prev>0&&x.eps_q_recent!=null?((x.eps_q_recent/x.eps_q_prev-1)*100>=0?'+':'')+((x.eps_q_recent/x.eps_q_prev-1)*100).toFixed(0)+'%':'—'))})`:''}`;
  }).join('\n');
}

// ── 동시수급 일괄: 전 종목 목록 인라인 (A49) ──
//   3~5개만 report-data를 여는 구조라, 나머지 종목은 수급이 손에 없어 「뺄 것」을 밸류로만 걸렀다.
//   ★컨센서스는 일부러 뺐다 — 목표를 부르기 전에 보면 그 값에 끌려간다(A41).
function fmtBothList(items){
  return (items||[]).map((x,i)=>{
    const e=x.enrich||{}, v=e.valuation||{}, ma=(e.ma&&e.ma.vs)||{}, ir=e.idxRel||{}, sc=e.supplyCum||{};
    const num=(z,d)=> (z==null||isNaN(z)) ? '—' : (d?(+z).toFixed(d):Math.round(z).toLocaleString());
    const pct=(z)=> (z==null||isNaN(z)) ? '—' : ((z>=0?'+':'')+(+z).toFixed(1)+'%');
    return `${i+1}. ${x.name}(${x.code}) · ${x.market||''} · ${num(e.now)}원 ${pct(e.changePct)}
   수급 10일 외국인 ${x.f_buydays||'-'} ${num(x.f_net)}주 / 연기금 ${x.p_buydays||'-'} ${num(x.p_net)}주
   구간 외국인 5일 ${num(sc.f5d)} · 20일 ${num(sc.f20d)} · 60일 ${num(sc.f60d)} → ${sc.fdir||'—'} / 연기금 20일 ${num(sc.p20d)} · 60일 ${num(sc.p60d)}
   밸류 PER ${v.per!=null?num(v.per,1)+'배':'—(적자 또는 산출 불가)'} · 추정PER ${v.fwdPer!=null?num(v.fwdPer,1)+'배':'—'} · PBR ${v.pbr!=null?num(v.pbr,2)+'배':'—'} · 배당수익률 ${v.divYield!=null?num(v.divYield,2)+'%':'—'} · 외국인 지분율 ${v.foreignRate!=null?num(v.foreignRate,2)+'%':'—'}
   위치 20일선과의 거리 ${pct(ma.ma20)} · 60일선 ${pct(ma.ma60)} · 52주 내 위치 ${e.pos52w&&e.pos52w.pct!=null?num(e.pos52w.pct,0)+'%':'—'}
   지수 대비 52주 고점 ${ir.peakDate||'—'} 이후 ${pct(ir.ddFromPeak)} (같은 기간 지수 ${pct(ir.idxSincePeak)}) · 1개월 ${pct(ir.m1)} (지수 대비 ${pct(ir.m1Excess)}) · 6개월 ${pct(ir.m6)} (지수 대비 ${pct(ir.m6Excess)})`;
  }).join('\n');
}

// ── 개별 종목 프롬프트 (저가매수형 / 모멘텀형) ──
//   report-data 파일이 없는 종목이므로 스캔 지표를 직접 담고, 나머지는 지침대로 1차(다음)에서 취득.
// ★비교 지수는 종목이 속한 시장 — 코스피와 코스닥은 흐름이 크게 다르다
function idxName(x){ return (x&&x.market==='KOSDAQ') ? '코스닥' : '코스피'; }

function fmtOne(x){
  const s=(x.labels&&x.labels.supply)||null, v=(x.labels&&x.labels.valuation)||{};
  return `[스캔 지표 — ${DATA&&DATA.updated?DATA.updated+' 기준':''}]
· 현재가 ${Math.round(x.cur).toLocaleString()}원 (${(x.changeRate>=0?'+':'')+x.changeRate.toFixed(2)}%) · 시총 ${x.mcap?Math.round(x.mcap/1e8).toLocaleString()+'억':'—'} · ${x.sector||''}
· 20일선 ${Math.round(x.ma20).toLocaleString()}원 · 20일선과의 거리 ${x.ma20_gap.toFixed(1)}% · 일봉 정배열 ${x.daily_aligned?'○ (진입 '+(x.entry_days!=null?x.entry_days:'—')+'일차)':'✗'} · 60주선(장기추세) 위 ${x.weekly_ma60_above?'○':'✗'}
· 수익률 1개월 ${x.r1!=null?x.r1.toFixed(1)+'%':'—'}${x.idx_r1!=null?` (같은 기간 ${idxName(x)} ${(x.idx_r1>=0?'+':'')+x.idx_r1.toFixed(1)}% → ${(x.excess_r1>=0?'+':'')+x.excess_r1.toFixed(1)}%p)`:''} · 6개월 ${x.r6!=null?x.r6.toFixed(1)+'%':'—'}${x.idx_r6!=null?` (${idxName(x)} ${(x.idx_r6>=0?'+':'')+x.idx_r6.toFixed(1)}% → ${(x.excess_r6>=0?'+':'')+x.excess_r6.toFixed(1)}%p)`:''} · 52주(장중 저~고) ${x.low52w?Math.round(x.low52w).toLocaleString():'—'}~${x.high52w?Math.round(x.high52w).toLocaleString():'—'} (위치 ${x.pos52w!=null?x.pos52w.toFixed(0)+'%':'—'})
· 거래량 20일/60일 ${x.v2060?x.v2060.toFixed(2)+'배':'—'}
· 밸류 PER ${x.per!=null?x.per.toFixed(1)+'배':'—'}(다음 확정EPS 기준) · ${v.sector_valid?'업종PER '+v.sectorPer.toFixed(1)+'배':'업종PER 무효(음수·200초과) → 절대PER과 동종 개별로 대체'} · PBR ${v.pbr!=null?(+v.pbr).toFixed(2)+'배':'—'} · DPS ${v.dps!=null?v.dps:'—'}${x.excess_dd!=null?`
· 52주 고점 종가 ${x.peak_close?Math.round(x.peak_close).toLocaleString()+'원':'—'} @ ${x.peak_date||'—'} (${x.peak_days!=null?x.peak_days+'일 전':'—'})`:''}${x.sales_growth!=null?`
· 매출 ${(x.sales_growth>=0?'+':'')+x.sales_growth.toFixed(1)}% · 영업이익률 ${x.opm_prev!=null?x.opm_prev.toFixed(1):'—'}→${x.opm_recent!=null?x.opm_recent.toFixed(1)+'%':'—'} (직전 분기 대비) · 이익수익률 ${x.earn_yield!=null?x.earn_yield.toFixed(1)+'%':'—'} (연율PER ${x.per_ann!=null?x.per_ann.toFixed(1)+'배':'—'}) · ROE ${x.roe_ann!=null?x.roe_ann.toFixed(1)+'%':'—'}`:''}
· 수급 ${s?`외국인 ${s.f_buydays||'-'} (${s.f_net!=null?s.f_net.toLocaleString():'—'}) / 연기금 ${s.p_buydays||'-'} (${s.p_net!=null?s.p_net.toLocaleString():'—'})${s.is_zero_rank?' 외국인+연기금 동시':''}`:'신호 없음 — 기술만 좋고 수급은 아직 없습니다(더 이른 단계일 수 있습니다)'}
★위 지표는 이미 계산돼 있다. 다시 받지 마라. 해석만 하면 된다.
★검색어는 두 번으로 묶어라 — "종목명 + 최근 주가 원인·업황" / "종목명 + 촉매·목표주가·동종 밸류"
   (검색 순서·취득처·차단 목록은 아래 [데이터 취득]에 있다)
  추가로 받을 것은 아래 다섯뿐이고, ★한 번에 병렬로 받아라(순차 5.9초 → 병렬 1.2초. 실측).
   ① days — 거래량이 몰린 가격대(지지·저항)를 잡는 용도 (★통째로 읽지 말고 파일로 저장 후 python으로 계산해 결과만)
       ★정교하게 계산하지 마라. 구간을 어떻게 나누냐에 따라 답이 달라져 정밀도가 무의미하다. 어디가 저항이고 어디가 지지인지만 알면 된다.
   ② investor — 수급 60일 일별 (5/20/60일 누적 비교용)
   ③ financials — 확정 분기재무
   ④ disclosures — 공시
   ⑤ quotes — 회사개요·시장경보·실시간 시세 확인용
  컨센·목표주가·뉴스는 수급 파일 링크가 있으면 거기서, 없으면 검색으로.`;
}

// ── 검색 탭: 백지 상태 종합 진단 ──
//   다른 탭은 필터가 전제를 확보해준다("수급이 좋다"/"싸다"/"오른다").
//   검색은 그 전제가 하나도 없다 → '왜 X한가'가 아니라 'X가 뭔가'부터 시작한다.
//   스캔 지표도 report-data도 없으므로, 지침대로 1차부터 전부 직접 취득한다.
// 미국 종목 검색 — 국내 검색과 질문은 같고 재료만 다르다.
//   투자자별 수급도 공시 목록도 없으므로 실적·가이던스·업황이 그 자리를 대신한다.
function buildSearchUS(ticker){
  const T = (ticker||'').toUpperCase();
  const NM = ((US_DICT.find(d=>d[0]===T)||[])[2]) || (US_ALL && (US_ALL.find(d=>d[0]===T)||[])[1]) || T;

function buildValueOne(x){

[EPS 4분기]
  ${eq||'—'}`});

  const analCode = it.ref || it.code;   // 실제 분석/데이터 대상 코드
  const analName = it.ref ? (it.ref_name || it.name) : it.name;  // 파생이면 본주명으로 제목 통일
  const url=D(analCode);

  // ── 내 종목 = 변화 모드 (이미 아는 종목 → '최근 무엇이 바뀌었나' 중심) ──
  if(it.ptype==='stock'){
    return briefPrompt({market:'kr', code:analCode, name:analName, cmd:bundleCmd(analCode)+' --brief', title:`${analName}(${analCode}) — 보유 중이거나 지켜보고 있는 종목입니다.`, extra:(it.ref?`보유 중인 것은 이를 추종하는 파생상품이지만 분석 대상은 ${analName} 자체입니다. 파생상품의 가격·거래량·유동성은 다루지 않으며, 모든 지표는 ${analName} 기준으로 작성합니다.`:'')});
  }
  if(it.ptype==='index'){
    return indexPrompt({code:analCode, name:it.basis, title:`${it.basis} — 보유 중이거나 지켜보고 있는 지수입니다.`, note:`분석 대상은 ${it.basis} 자체입니다. 보유 중인 추종 상품의 구조나 가격은 다루지 않습니다.`, data:`수급·지수 데이터: ${url}`});
  }
  if(it.ptype==='us'){
    const tgt=txt(it.us_target||''), tk=txt(it.us_ticker||'');
    if(it.us_kind==='index'){
      return indexPrompt({code:analCode, name:tgt, title:`${tgt} — 보유 중이거나 지켜보고 있는 지수입니다.`, note:`분석 대상은 ${tgt} 자체입니다. 보유 중인 추종 상품의 구조나 가격은 다루지 않습니다.`, data:`다음 금융 global/today와 exchanges, 나스닥 API에서 지수 수준과 등락을 받습니다.`});
    }
    return briefPrompt({market:'us', code:tk, name:tgt, cmd:bundleCmdUS(tk), title:`${tgt}(${tk}) — 보유 중이거나 지켜보고 있는 종목입니다.`, extra:`보유 중인 것은 이를 추종하는 파생상품이지만 분석 대상은 ${tgt} 자체입니다. 파생상품의 가격·거래량·괴리율은 다루지 않으며, 모든 지표는 ${tgt} 기준으로 작성합니다.`});
  }
  if(it.ptype==='sector'){
    const surl=D(it.sector_key);
    const members=((it.supply&&it.supply.sector_members)||[]).map(m=>esc(m.name)+'('+m.code+')').join(', ');
    return indexPrompt({code:analCode, name:it.basis+' 섹터', title:`${it.basis} 섹터 — 구성종목 ${members}를 묶어 섹터 단위로 분석합니다. 개별 종목 리포트를 따로 쓰지 않습니다.`, note:'분석 대상은 구성종목을 묶은 섹터 자체입니다. 보유 중인 추종 상품의 구조나 가격은 다루지 않습니다.', data:`구성종목 수급 데이터: ${surl}`});
  }

  // ── 동시(수급 종목) = 분석 모드 (처음 보는 후보 → 풀 9섹션 분석) ──
  return briefPrompt({market:'kr', code:it.code, name:it.name, cmd:bundleCmd(it.code)+' --brief', title:`${it.name}(${it.code}) — 외국인과 연기금이 동시에 순매수한 종목으로 선별되었습니다.`});
}
function copyPrompt(ev, code){
  ev.stopPropagation();
  const pool=[...(DATA&&DATA.portfolio||[]), ...(DATA&&DATA.both||[])];
  const it=pool.find(x=>x.code===code);
  if(!it) return;
  const btn=ev.currentTarget;
  let text;
  try{ text=buildPrompt(it); }catch(e){ copyFailed(btn,e); return; }
  const done=()=>{ const o=btn.textContent; btn.textContent='복사됨 ✓'; btn.classList.add('copied');
    setTimeout(()=>{btn.textContent=o; btn.classList.remove('copied');},1600); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
  }else{ fallbackCopy(text,done); }
}
function copyFailed(btn, err, isHtml){
  // ★조용히 죽지 않게 한다 — 예전엔 빌더가 터지면 버튼이 무반응이라 원인을 알 수 없었다.
  console.error('프롬프트 생성 실패:', err);
  const o = isHtml ? btn.innerHTML : btn.textContent;
  const set = v => { if(isHtml) btn.innerHTML=v; else btn.textContent=v; };
  set('생성 실패 — ↻ 새로고침'); btn.classList.add('copied');
  setTimeout(()=>{ set(o); btn.classList.remove('copied'); }, 3000);
}
function fallbackCopy(text, done){
  const ta=document.createElement('textarea'); ta.value=text;
  ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta); done();
}
function hardReload(){
  // 캐시 무시 재접속: 주소에 현재 시각을 붙여 브라우저가 index.html을 새로 받게 한다
  const u = location.origin + location.pathname + '?t=' + Date.now();
  location.replace(u);
}

}

// 미국 전체 종목 목록(스캐너가 만들어 둔 파일) — 사전에 없는 종목을 티커·영문명으로 찾는다.
let US_ALL = null;
async function lookupUS(q){
  if(US_ALL === null){
    try{
      const r = await fetch('https://raw.githubusercontent.com/dodary-kfilter/kfilter/main/us_universe.json');
      US_ALL = await r.json();
    }catch(e){ US_ALL = []; }
  }
  const s = (q||'').trim().toUpperCase();
  if(!s || !US_ALL.length) return {hits:[], near:[]};
  const starts = [], part = [];
  for(const [tk, nm, asset] of US_ALL){
    if(tk === s){ starts.unshift({ticker:tk, asset, name:nm}); continue; }
    if(tk.startsWith(s)) starts.push({ticker:tk, asset, name:nm});
    else if(s.length >= 3 && nm.toUpperCase().includes(s)) part.push({ticker:tk, asset, name:nm});
    if(starts.length + part.length > 60) break;
  }
  const hits = starts.concat(part).slice(0, 8);
  if(hits.length) return {hits, near:[]};
  // 목록에 없으면 오타를 의심한다 — 같은 글자 조합이거나 한 글자만 다른 티커를 찾는다
  const key = s.split('').sort().join('');
  const near = [];
  for(const [tk, nm, asset] of US_ALL){
    if(Math.abs(tk.length - s.length) > 1) continue;
    if(tk.split('').sort().join('') === key){ near.unshift({ticker:tk, asset, name:nm}); continue; }
    if(tk.length === s.length){
      let d = 0;
      for(let i=0;i<s.length;i++){ if(tk[i] !== s[i] && ++d > 1) break; }
      if(d <= 1) near.push({ticker:tk, asset, name:nm});
    }
    if(near.length > 20) break;
  }
  return {hits:[], near:near.slice(0, 6)};
}

// 검색어 → 미국 종목 매칭. 완전일치 우선, 그다음 부분일치.
function searchUS(q){
  const s = (q||'').trim().toLowerCase().replace(/\s+/g,'');
  if(!s) return [];
  const exact = [], part = [];
  for(const [tk, asset, disp, keys] of US_DICT){
    if(tk.toLowerCase() === s){ exact.push({ticker:tk, asset, name:disp}); continue; }
    let hitE = false, hitP = false;
    for(const k of keys){
      const kk = k.toLowerCase().replace(/\s+/g,'');
      if(kk === s){ hitE = true; break; }
      if(kk.includes(s) || s.includes(kk)) hitP = true;
    }
    if(hitE) exact.push({ticker:tk, asset, name:disp});
    else if(hitP || tk.toLowerCase().includes(s)) part.push({ticker:tk, asset, name:disp});
  }
  return exact.concat(part).slice(0, 12);
}

function doSearch(){
  const q = (document.getElementById('sq').value || '').trim();
  const box = document.getElementById('sres');
  if(!q){ box.innerHTML = '<div class="empty">종목명 또는 코드를 입력하세요.</div>'; return; }
  if(!UNIV){ box.innerHTML = '<div class="empty">종목 목록을 불러오지 못했습니다.</div>'; return; }
  const qq = q.toUpperCase();
  const hits = [];
  for(const sc in UNIV){
    const nm = UNIV[sc].name || '';
    const code = sc.startsWith('A') ? sc.slice(1) : sc;
    if(nm.toUpperCase().includes(qq) || code.includes(qq)){
      hits.push({code, name:nm, market:UNIV[sc].market});
    }
    if(hits.length >= 60) break;
  }
  // 미국 종목 — 사전에서 한글명·별칭·티커로 찾고, 영문·티커는 나스닥에서 추가로 찾는다.
  const us = searchUS(q);
  if(/^[A-Za-z.]{1,6}$/.test(q)){
    lookupUS(q).then(r => {
      const el = document.getElementById('usmore');
      if(!el) return;
      const card = (u) => '<div class="pcard"><div class="prow">'
          + '<div class="pname"><b>' + esc(u.name) + '</b> <span class="pcode">' + u.ticker + '</span>'
          + ' <span style="color:var(--dim);font-size:11px">' + (u.asset==='etf'?'US ETF':'US') + '</span></div>'
          + '<button class="copybtn" onclick="copySearchUS(event,\'' + u.ticker + '\')" '
          + 'title="종합 진단 프롬프트 (미국)">프롬프트</button>'
          + '</div></div>';
      const have = new Set(us.map(u=>u.ticker));
      const add = r.hits.filter(e => !have.has(e.ticker));
      if(add.length){
        el.innerHTML = '<div class="sec"><div class="sechd">미국 종목 ' + add.length + '</div>'
          + add.map(card).join('') + '</div>';
      } else if(r.near.length){
        el.innerHTML = '<div class="sec"><div class="sechd">' + esc(q.toUpperCase())
          + ' 은 미국 종목 목록에 없습니다. 혹시 이 종목입니까?</div>'
          + r.near.map(card).join('') + '</div>';
      } else if(US_ALL.length){
        el.innerHTML = '<div class="sec"><div class="sechd">'
          + esc(q.toUpperCase()) + ' 은 미국 종목 목록에 없습니다</div></div>';
      }
    });
  }
  const usHtml = us.length
    ? '<div class="sec"><div class="sechd">미국 종목 ' + us.length + '</div>'
      + us.map(u =>
          '<div class="pcard"><div class="prow">'
          + '<div class="pname"><b>' + esc(u.name) + '</b> <span class="pcode">' + u.ticker + '</span>'
          + ' <span style="color:var(--dim);font-size:11px">'
          + (u.asset === 'etf' ? 'US ETF' : 'US') + '</span></div>'
          + '<button class="copybtn" onclick="copySearchUS(event,\'' + u.ticker + '\')" '
          + 'title="백지 상태 종합 진단 프롬프트 (미국)">프롬프트</button>'
          + '</div></div>').join('')
      + '</div>'
    : '';

  // 목록 조회가 실패했을 때만 쓰는 예비 경로 (정상일 때는 위 lookupUS가 처리한다)
  const rawTicker = (!us.length && US_ALL && !US_ALL.length && /^[A-Z.]{1,6}$/.test(qq))
    ? '<div class="sec"><div class="sechd">미국 종목</div>'
      + '<div class="pcard"><div class="prow">'
      + '<div class="pname"><b>' + qq + '</b> <span class="pcode">US</span>'
      + ' <span style="color:var(--dim);font-size:11px">티커로 조회</span></div>'
      + '<button class="copybtn" onclick="copySearchUS(event,\'' + qq + '\')" '
      + 'title="백지 상태 종합 진단 프롬프트 (미국)">프롬프트</button>'
      + '</div></div></div>'
    : '';

  if(!hits.length){
    const tail = usHtml || rawTicker;
    box.innerHTML = (tail || '<div class="empty">검색 결과가 없습니다. 미국 종목은 한글명(예: 엔비디아)이나 티커(예: NVDA)로 입력하세요.</div>')
      + '<div id="usmore"></div>';
    return;
  }
  // 정렬: ①보통주 우선(우선주·전환우는 뒤로) ②검색어로 시작하는 이름 우선 ③가나다
  const isPref = (c)=> !(/^\d{5}0$/.test(c));   // 보통주는 6자리 숫자이며 끝이 0
  hits.sort((a,b)=>{
    const ap = isPref(a.code)?1:0, bp = isPref(b.code)?1:0;
    if(ap!==bp) return ap-bp;
    const as = a.name.toUpperCase().startsWith(qq) ? 0 : 1;
    const bs = b.name.toUpperCase().startsWith(qq) ? 0 : 1;
    return as - bs || a.name.localeCompare(b.name);
  });
  box.innerHTML = '<div class="sec"><div class="sechd">검색 결과 ' + hits.length + '종목</div>'
    + hits.map(h =>
        '<div class="pcard"><div class="prow">'
        + '<div class="pname"><b>' + esc(h.name) + '</b> <span class="pcode">' + h.code + '</span>'
        + ' <span style="color:var(--dim);font-size:11px">' + esc(h.market||'') + '</span></div>'
        + '<button class="copybtn" onclick="copySearch(event,\'' + h.code + '\',\'' + esc(h.name).replace(/'/g,"\\'") + '\')" '
        + 'title="백지 상태 종합 진단 프롬프트">프롬프트</button>'
        + '</div></div>').join('')
    + '</div>'
    + usHtml + rawTicker + '<div id="usmore"></div>';   // 국내 아래에 미국 결과를 이어 붙인다
}

function copySearchUS(ev, ticker){
  ev.stopPropagation();
  const btn = ev.currentTarget;
  let text;
  try{ text = buildSearchUS(ticker); }catch(e){ copyFailed(btn,e); return; }
  const done = ()=>{ const t=btn.textContent; btn.textContent='복사됨'; setTimeout(()=>btn.textContent=t,1200); };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done, ()=>fallbackCopy(text, done)); }
  else fallbackCopy(text, done);
}

function copySearch(ev, code, name){
  ev.stopPropagation();
  const btn = ev.currentTarget;
  let text;
  try{ text = buildSearchOne(code, name); }catch(e){ copyFailed(btn,e); return; }
  const done = ()=>{ const o=btn.textContent; btn.textContent='복사됨 ✓'; btn.classList.add('copied');
    setTimeout(()=>{btn.textContent=o; btn.classList.remove('copied');},1600); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
  }else{ fallbackCopy(text,done); }
}

function sectionScreen(items, isV){
  const rows = items.map((x,i)=>{
    const sup = (x.labels&&x.labels.supply)||null;
    const val = (x.labels&&x.labels.valuation)||{};
    const supTxt = sup
      ? '<span style="color:var(--foreign)">외 '+(sup.f_buydays||'—')+'</span> <span style="color:var(--pension)">연 '+(sup.p_buydays||'—')+'</span>'+(sup.is_zero_rank?' <b style="color:var(--both)">동시</b>':'')
      : '<span style="color:#6e7681">수급 신호 없음</span>';
    const perTxt = (x.per!=null? x.per.toFixed(1)+'배':'—')
      + (val.sector_valid? ' <span style="color:var(--dim)">(업종 '+val.sectorPer.toFixed(1)+')</span>'
                          : ' <span style="color:#6e7681">(업종비교 무효)</span>');
    const mid = isV
      ? '지수대비 '+(x.excess_dd!=null?x.excess_dd.toFixed(0)+'p':'—')+' · 업종대비 '+(x.vs_sector_dd!=null?x.vs_sector_dd.toFixed(0)+'p':'—')+' · 낙폭 '+fmtPct(x.dd_close)+' · 매출 '+(x.sales_growth!=null?(x.sales_growth>=0?'+':'')+x.sales_growth.toFixed(0)+'%':'—')+' · 영업이익률 '+(x.opm_prev!=null?x.opm_prev.toFixed(1):'—')+'→'+(x.opm_recent!=null?x.opm_recent.toFixed(1)+'%':'—')
      : '정배열 '+x.entry_days+'일차 · 1개월 '+fmtPct(x.r1)+' · 20일선 '+fmtPct(x.ma20_gap)+' · 거래량 '+(x.v2060?x.v2060.toFixed(2):'—')+'배';
    const warn = (!isV && x.ma20_gap>25) ? ' <b style="color:#f85149">과열</b>' : '';
    return '<div class="pcard">'
      +'<div class="prow"><div class="pname">'+(i+1)+'. <b>'+esc(x.name)+'</b> <span class="pcode">'+x.code+'</span>'
      +' <span style="color:var(--dim);font-size:11px">'+esc(x.sector||'')+'</span></div>'
      +'<button class="copybtn" onclick="copyOne(event,\''+x.code+'\','+(isV?'1':'0')+')" title="이 종목 정밀 분석 프롬프트">프롬프트</button></div>'
      +'<div class="pinfo">'+fmtN(x.cur)+'원 '+fmtPct(x.changeRate)+' · '+mid+warn+'</div>'
      +'<div class="pinfo">PER '+perTxt+' · PBR '+(val.pbr!=null?val.pbr:'—')+' · '+supTxt+'</div>'
      +'</div>';
  }).join('');
  return '<div class="sec"><div class="sechd">'+(isV?'저가매수형':'모멘텀형')+' '+items.length+'종목</div>'+rows+'</div>';
}
function fmtPct(v){ if(v==null) return '—'; const t=(v>=0?'+':'')+v.toFixed(1)+'%'; return '<span style="color:'+(v>=0?'#f85149':'#4493f8')+'">'+t+'</span>'; }
function fmtN(v){ return v==null?'—':Number(v).toLocaleString('ko-KR'); }
function render(){
  const content=document.getElementById('content');
  if(!DATA){content.innerHTML='<div class="empty">데이터 없음</div>';return;}
  const items=DATA[CUR]||[];
  // [검색 탭] 필터를 안 거친 종목 — 백지 상태 종합 진단용
  if(CUR==='search'){
    content.innerHTML =
      '<div class="srow"><input id="sq" class="sinput" type="search" placeholder="종목명·코드·미국 종목 (예: 삼성전자, 005930, 엔비디아, NVDA)" '
      + 'oninput="doSearch()" autocomplete="off"><button class="sbtn" onclick="doSearch()">검색</button></div>'
      + '<div id="sres"><div class="empty">종목명 또는 코드를 입력하세요.</div></div>';
    loadUniverse().then(()=>{
      const box=document.getElementById('sres');
      if(!UNIV && box) box.innerHTML='<div class="empty">종목 목록을 불러오지 못했습니다.<br><span style="font-size:12px;color:var(--dim)">스캐너가 한 번 이상 실행되어야 목록이 생성됩니다.</span></div>';
      const q=document.getElementById('sq');
      if(q && q.value) doSearch();
    });
    return;
  }
  if(CUR==='portfolio'){
    if(items.length===0){content.innerHTML='<div class="empty">포트폴리오 종목이 없습니다.</div>';return;}
    content.innerHTML = sectionPort(items);
    return;
  }
  // [기술적 필터 탭] 저가매수형·모멘텀형 — 수급과 독립. 조건 통과 여부만 보여준다(순위·판단 없음).
  if(CUR==='value_pick' || CUR==='momentum'){
    const isV = CUR==='value_pick';
    if(items.length===0){
      content.innerHTML='<div class="empty">오늘 '+(isV?'저가매수형':'모멘텀형')+' 조건을 충족한 종목이 없습니다.<br><span style="font-size:12px;color:var(--dim)">'+(isV?'자격 미달이면 채우지 않습니다.':'개수를 맞추려 기준을 풀지 않습니다. 0개면 0개입니다.')+'</span></div>';
      return;
    }
    content.innerHTML = sectionScreen(items, isV);
    return;
  }
  const label=CUR==='foreign'?'외국인':CUR==='pension'?'연기금':'외국인·연기금 동시';
  if(items.length===0){content.innerHTML='<div class="empty">'+label+' 종목이 없습니다.</div>';return;}
  const kospi=items.filter(x=>x.market==='KOSPI');
  const kosdaq=items.filter(x=>x.market==='KOSDAQ');
  if(CUR==='both'){
    content.innerHTML = sectionBoth('KOSPI', kospi, 'kospi') + sectionBoth('KOSDAQ', kosdaq, 'kosdaq');
  }else{
    content.innerHTML = sectionSingle('KOSPI', kospi, 'kospi') + sectionSingle('KOSDAQ', kosdaq, 'kosdaq');
  }
}
function show(k){
  CUR=k;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.k===k));
  const b=document.getElementById('screenbtn');
  if(b){
    b.textContent = '일괄 스크리닝 프롬프트';   // 탭 무관 통일 (내용은 탭별로 다름)
    // 스크리닝 프롬프트는 0순위·저가매수·모멘텀 탭에서만 의미가 있다
    b.style.display = (k==='both'||k==='value_pick'||k==='momentum') ? '' : 'none';
  }
  render();
}
// 재접속 직후 주소창의 캐시버스팅 파라미터를 지워 깔끔하게 유지
if(location.search.indexOf('t=')>-1 || location.search.indexOf('v=')>-1){
  try{ history.replaceState(null,'',location.origin+location.pathname); }catch(e){}
}
async function load(){
  document.getElementById('content').innerHTML='<div class="loading">데이터를 불러오는 중…</div>';
  try{
    let res;
    try{ res=await fetch('https://raw.githubusercontent.com/dodary-kfilter/kfilter/main/data.json?t='+Date.now(),{cache:'no-store'}); if(!res.ok) throw 0; }
    catch(_){ res=await fetch('data.json?t='+Date.now(),{cache:'no-store'}); if(!res.ok) throw new Error(); }
    DATA=await res.json();
    document.getElementById('updated').textContent=DATA.updated;
    document.getElementById('c-foreign').textContent=DATA.foreign.length;
    document.getElementById('c-pension').textContent=DATA.pension.length;
    document.getElementById('c-both').textContent=DATA.both.length;
    document.getElementById('c-value_pick').textContent=(DATA.value_pick||[]).length;
    document.getElementById('c-momentum').textContent=(DATA.momentum||[]).length;
    document.getElementById('c-portfolio').textContent=(DATA.portfolio||[]).length;
    document.getElementById('rule').innerHTML='판정: 최근 <b>'+DATA.window+'거래일</b> 누적 순매수 <b>&gt; 0</b> 그리고 순매수일 <b>'+DATA.buy_ratio+'% 이상</b> · 스캔 <b>'+DATA.scanned+'종목</b>';
    render();
  }catch(e){
    document.getElementById('content').innerHTML='<div class="empty">data.json 을 불러오지 못했습니다.<br>스캐너를 먼저 실행했는지 확인하세요.</div>';
  }
}
load();
