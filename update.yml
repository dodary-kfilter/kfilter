name: 수급 스캔 자동 실행

on:
  schedule:
    # 장중 모니터링 — 한국시간 09:30~15:30 매시 30분 + 19:30(수급 확정 후)
    #   UTC = KST-9  →  00:30,01:30,...,06:30, 10:30
    #   ※ GitHub 예약은 부하 시 지연될 수 있음(데이터엔 무해). 주말·공휴일은 scanner가 가드로 스킵.
    - cron: '30 0,1,2,3,4,5,6,10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 라이브러리 설치
        run: pip install requests

      - name: 스캐너 실행
        run: python scanner.py
        env:
          RUN_TRIGGER: ${{ github.event_name }}

      - name: 결과 커밋
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          # 파이썬 캐시는 커밋하지 않는다(.gitignore로도 막지만, 이미 추적 중인 것까지 정리)
          rm -rf __pycache__
          git rm -r --cached __pycache__ --ignore-unmatch -q || true
          git add -A
          git commit -m "데이터 갱신 $(date -u +%Y-%m-%d)" || echo "변경 없음"
          git push
